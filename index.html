<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Anthill: A harvester ant colony built from the published science</title>
    <meta
      name="description"
      content="An agent-based simulation of a Florida harvester ant colony, from a single mated queen to the death of the colony."
    />
    <!-- The card shown when the link is shared. The image is rendered from tools/social-card.html. -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Anthill: A harvester ant colony built from the published science"
    />
    <meta
      property="og:description"
      content="Watch a Florida harvester ant colony dig its nest, forage and move house in your browser. Every value in the model is traced to a published study or marked as invented."
    />
    <meta property="og:url" content="https://adiezc.github.io/ANThill-Sim/" />
    <meta property="og:image" content="https://adiezc.github.io/ANThill-Sim/social-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The word Anthill beside a slice through a harvester ant nest, with the queen, brood and seed store labelled"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // The remembered theme, set before the first paint so a light-theme reader never sees a
      // dark flash. src/ui/theme.ts owns the choice after this, and the key must match it.
      try {
        if (localStorage.getItem('anthill-theme') === 'light') {
          document.documentElement.dataset.theme = 'light'
        }
      } catch {}
    </script>
    <link rel="stylesheet" href="./src/ui/style.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
